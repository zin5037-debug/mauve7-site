<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>페이지를 찾을 수 없습니다 — Mauve7</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
:root{--bg:#f7f5f7;--ink:#1d1a1f;--muted:#5f5a63;--accent:#7b5a8c}
@media (prefers-color-scheme: dark){:root{--bg:#16141a;--ink:#ece8ee;--muted:#a69fab;--accent:#c4a3d4}}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Pretendard",system-ui,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;display:grid;place-items:center;padding:24px;word-break:keep-all;text-align:center}
h1{font-size:clamp(28px,5vw,44px);letter-spacing:-.03em;line-height:1.25}
p{color:var(--muted);margin:14px 0 30px}
a{display:inline-block;padding:14px 22px;border-radius:999px;background:var(--accent);color:#fff;text-decoration:none;font-weight:600}
</style>
</head>
<body>
<main>
  <h1>그 주소에는 아무것도 없습니다.</h1>
  <p>페이지가 옮겨졌거나 주소가 잘못 입력됐습니다.</p>
  <a href="/">Mauve7 첫 화면으로</a>
</main>
</body>
</html>
